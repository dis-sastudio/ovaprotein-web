# /etc/nginx/sites-available/ovaprotein.com
# Sirve los archivos estáticos directo con nginx y pasa /api al servidor Node (puerto 3107).
server {
    listen 80;
    listen [::]:80;
    server_name ovaprotein.com www.ovaprotein.com;

    root /var/www/ovaprotein/public;
    index index.html;
    error_page 404 /404.html;

    # Redirige el dominio sin www a www (canonical)
    if ($host = ovaprotein.com) { return 301 $scheme://www.ovaprotein.com$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1m;
    }

    location ~* ^/(eggstrong|producto/) { return 301 /proteina-de-huevo-ova-pro/; }
    location /assets/js/ { expires 1h; }
    location /assets/ { expires 365d; add_header Cache-Control "public, immutable"; }
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
